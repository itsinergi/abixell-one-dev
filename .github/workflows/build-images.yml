name: Build and Push Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      api-digest: ${{ steps.build-api.outputs.digest }}
      api-operations-digest: ${{ steps.build-api-operations.outputs.digest }}
      web-digest: ${{ steps.build-web.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag (if tag-triggered)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="staging-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build API runtime image (local, for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: runtime
          push: false
          load: true
          tags: scan/abixell-one-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API operations image (local, for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: operations
          push: false
          load: true
          tags: scan/abixell-one-api-operations:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (local, for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runtime
          push: false
          load: true
          tags: scan/abixell-one-web:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan API runtime (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/abixell-one-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-api.json

      - name: Trivy scan API operations (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/abixell-one-api-operations:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-api-operations.json

      - name: Trivy scan Web (gate before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/abixell-one-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-web.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: trivy-*.json
          retention-days: 90

      - name: Build and push API runtime image
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api:staging
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api:${{ steps.meta.outputs.version }}
          sbom: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API operations image
        id: build-api-operations
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: operations
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api-operations:staging
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api-operations:${{ steps.meta.outputs.version }}
          sbom: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-web:staging
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-web:${{ steps.meta.outputs.version }}
          sbom: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Print cosign version
        run: cosign version

      - name: Sign images (keyless OIDC)
        run: |
          set -euo pipefail

          API_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api@${{ steps.build-api.outputs.digest }}"
          API_OPERATIONS_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-api-operations@${{ steps.build-api-operations.outputs.digest }}"
          WEB_IMAGE="${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/abixell-one-web@${{ steps.build-web.outputs.digest }}"

          echo "Signing API runtime image..."
          cosign sign --yes "$API_IMAGE"
          echo "Signing API operations image..."
          cosign sign --yes "$API_OPERATIONS_IMAGE"
          echo "Signing Web image..."
          cosign sign --yes "$WEB_IMAGE"

          echo "Verifying API runtime signature..."
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/itsinergi/abixell-one-dev/\.github/workflows/build-images\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$API_IMAGE" > /dev/null

          echo "Verifying API operations signature..."
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/itsinergi/abixell-one-dev/\.github/workflows/build-images\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$API_OPERATIONS_IMAGE" > /dev/null

          echo "Verifying Web signature..."
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/itsinergi/abixell-one-dev/\.github/workflows/build-images\.yml@refs/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$WEB_IMAGE" > /dev/null

          echo "✓ All signatures verified successfully"

      - name: Create digests artifact
        run: |
          cat > digests.txt << 'EOF'
          API_DIGEST=${{ steps.build-api.outputs.digest }}
          API_OPERATIONS_DIGEST=${{ steps.build-api-operations.outputs.digest }}
          WEB_DIGEST=${{ steps.build-web.outputs.digest }}
          VERSION=${{ steps.meta.outputs.version }}
          EOF
          cat digests.txt

      - name: Upload digests artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digests
          path: digests.txt
          retention-days: 90

      - name: Job Summary
        run: |
          echo "## Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pushed Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API Runtime**" >> $GITHUB_STEP_SUMMARY
          echo "  - Tags: \`staging\`, \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Digest: \`${{ steps.build-api.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API Operations**" >> $GITHUB_STEP_SUMMARY
          echo "  - Tags: \`staging\`, \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Digest: \`${{ steps.build-api-operations.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Web**" >> $GITHUB_STEP_SUMMARY
          echo "  - Tags: \`staging\`, \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Digest: \`${{ steps.build-web.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}\`" >> $GITHUB_STEP_SUMMARY
