name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: CI 8-Gate Pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: abixell
          POSTGRES_PASSWORD: abixell_dev_password
          POSTGRES_DB: abixell_one_epic3_wave4
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://abixell:abixell_dev_password@localhost:5432/abixell_one_epic3_wave4
      JWT_ACCESS_SECRET: ci-access-secret
      PLATFORM_BOOTSTRAP_KEY: ci-bootstrap-secret
      SCHEDULER_DISABLED: "true"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ──────────────────────────────────────────────
      # GATE-1: Dependencies & Install (5 min)
      # ──────────────────────────────────────────────
      - name: "GATE-1: Install Dependencies"
        run: npm ci
        timeout-minutes: 5

      # ──────────────────────────────────────────────
      # GATE-2: Database Migration (3 min)
      # ──────────────────────────────────────────────
      - name: "GATE-2: Database Migration"
        run: npm run migrate -w apps/api
        timeout-minutes: 3

      # ──────────────────────────────────────────────
      # GATE-3: Platform Boundary Validation (2 min)
      # ──────────────────────────────────────────────
      - name: "GATE-3: Platform Boundary Validation"
        run: node scripts/validate-platform-boundaries.mjs
        timeout-minutes: 2

      # ──────────────────────────────────────────────
      # GATE-4: Lint (3 min)
      # ──────────────────────────────────────────────
      - name: "GATE-4: Lint"
        run: npm run lint
        timeout-minutes: 3

      # ──────────────────────────────────────────────
      # GATE-5: Typecheck (3 min)
      # ──────────────────────────────────────────────
      - name: "GATE-5: Typecheck"
        run: npm run typecheck
        timeout-minutes: 3

      # ──────────────────────────────────────────────
      # GATE-6: Unit Test (10 min)
      # ──────────────────────────────────────────────
      - name: Prepare test results directory
        run: mkdir -p apps/api/test-results

      - name: "GATE-6: Unit Test"
        run: npx vitest run --reporter=junit --reporter=default --outputFile=test-results/junit.xml
        working-directory: apps/api
        timeout-minutes: 10

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-junit
          path: apps/api/test-results/junit.xml
          retention-days: 90

      # ──────────────────────────────────────────────
      # GATE-7: Production Build (8 min)
      # ──────────────────────────────────────────────
      - name: "GATE-7: Production Build"
        run: npm run build
        timeout-minutes: 8

      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 30

      # ──────────────────────────────────────────────
      # GATE-8: Security & PWA Audit (5 min)
      # ──────────────────────────────────────────────
      - name: "GATE-8a: PWA Validation"
        run: npm run validate:pwa
        timeout-minutes: 5

      - name: "GATE-8b: Security Audit"
        run: npm audit --omit=dev --json > security-audit.json || true
        timeout-minutes: 5

      - name: "GATE-8c: Check Security Threshold"
        run: |
          HIGH=$(node -e "
            const a = require('./security-audit.json');
            const v = a.vulnerabilities || {};
            let count = 0;
            for (const key in v) {
              if (v[key].severity === 'high' || v[key].severity === 'critical') count++;
            }
            console.log(count);
          ")
          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::GATE-8 FAILED: $HIGH high/critical vulnerabilities found"
            exit 1
          fi
          echo "GATE-8 PASS: No high/critical vulnerabilities"

      - name: Upload Security Audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit.json
          retention-days: 90
