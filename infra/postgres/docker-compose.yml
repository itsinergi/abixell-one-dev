name: abixell-one

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abixell
      POSTGRES_PASSWORD: abixell_dev_password
      POSTGRES_DB: abixell_one
    # Local development only. Production uses infra/deployment/compose.yml
    # and never publishes PostgreSQL outside its internal network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - abixell_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abixell -d abixell_one"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abixell_postgres_data:
