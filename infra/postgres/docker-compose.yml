name: abixell-dev
services:
  abixell-dev:
    image: postgres:16-alpine
    container_name: abixell-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: abixell
      POSTGRES_PASSWORD: abixell_dev_password
      POSTGRES_DB: abixell_one_dev
    # Local Windows environment only.
    ports:
      - "127.0.0.1:5542:5432"
    volumes:
      - abixell_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abixell -d abixell_one_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  abixell_dev_pgdata:
    name: abixell_dev_pgdata
