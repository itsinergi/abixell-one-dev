name: ${COMPOSE_PROJECT_NAME:?Set a unique dedicated deployment project name}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Use an immutable PostgreSQL 16 image digest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    # Wave 8 (PITR): archive completed WAL segments to the bind-mounted WAL
    # directory so they survive a postgres-data volume loss and can be synced
    # offsite + used for point-in-time recovery. archive_timeout=5s forces a
    # segment switch every 5s even under low write load, bounding RPO to ≤5s
    # (CP-ENV-08). The migration is forward-only and the DB is never restored
    # during auto-rollback (FD-ENV-04), so WAL archiving never fights a
    # rollback.
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f", "-c", "archive_timeout=5s"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${WAL_ROOT:?Set WAL_ROOT for PITR archiving}
        target: /var/lib/postgresql/wal
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ${API_OPERATIONS_IMAGE:?Set immutable API operations image digest}
    platform: linux/amd64
    pull_policy: always
    restart: "no"
    working_dir: /app
    entrypoint: ["node"]
    command: ["node_modules/node-pg-migrate/bin/node-pg-migrate.js", "up", "-m", "apps/api/migrations", "--envPath", "/dev/null"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    profiles: [operations]

  sync-permissions:
    image: ${API_OPERATIONS_IMAGE:?Set immutable API operations image digest}
    platform: linux/amd64
    pull_policy: always
    restart: "no"
    working_dir: /app
    entrypoint: ["node"]
    command: ["apps/api/scripts/sync-role-permissions.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    profiles: [operations]

  backup:
    image: ${API_OPERATIONS_IMAGE:?Set immutable API operations image digest}
    platform: linux/amd64
    pull_policy: always
    restart: "no"
    working_dir: /app
    entrypoint: ["node"]
    command: ["scripts/backup-postgres.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BACKUP_ROOT: /data/backups
      FILE_STORAGE_ROOT: /data/documents
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?Set DEPLOYMENT_ENVIRONMENT}
      APPLICATION_RELEASE: ${APPLICATION_RELEASE:?Set APPLICATION_RELEASE}
      BACKUP_API_IMAGE: ${API_IMAGE:?Set immutable API image digest}
      BACKUP_OPERATIONS_IMAGE: ${API_OPERATIONS_IMAGE:?Set immutable API operations image digest}
      BACKUP_WEB_IMAGE: ${WEB_IMAGE:?Set immutable Web image digest}
      BACKUP_ID: ${BACKUP_ID:-}
    volumes:
      - document-data:/data/documents:ro
      - type: bind
        source: ${BACKUP_ROOT:?Set protected BACKUP_ROOT}
        target: /data/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    profiles: [operations]

  api:
    image: ${API_IMAGE:?Set immutable API image digest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    # Wave 9 (Container Hardening): cap_drop removes all capabilities;
    # no-new-privileges prevents child processes from gaining more privileges;
    # read_only prevents persistent malware writes; tmpfs provides a writable /tmp
    # without persisting to rootfs. Mitigates privilege escalation and container escape.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      PLATFORM_BOOTSTRAP_KEY: ${PLATFORM_BOOTSTRAP_KEY:?Set PLATFORM_BOOTSTRAP_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX:-1200}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1 minute}
      FILE_STORAGE_ROOT: /data/documents
      APPLICATION_RELEASE: ${APPLICATION_RELEASE:?Set APPLICATION_RELEASE}
      SCHEDULER_DISABLED: ${SCHEDULER_DISABLED:-false}
      INTEGRATION_OUTBOX_BATCH_SIZE: ${INTEGRATION_OUTBOX_BATCH_SIZE:-100}
      INTEGRATION_OUTBOX_MAX_ATTEMPTS: ${INTEGRATION_OUTBOX_MAX_ATTEMPTS:-5}
      INTEGRATION_OUTBOX_RETRY_BASE_SECONDS: ${INTEGRATION_OUTBOX_RETRY_BASE_SECONDS:-30}
      INTEGRATION_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${INTEGRATION_OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
    volumes:
      - document-data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/db').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?Set immutable Web image digest}
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    # Wave 9 (Container Hardening): cap_drop removes all capabilities;
    # no-new-privileges prevents child processes from gaining more privileges;
    # read_only prevents persistent malware writes; tmpfs provides writable
    # /tmp, /var/cache/nginx, and /var/run without persisting to rootfs.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks: [backend, ingress]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Wave 7 (CP-ENV-07): Dozzle is an optional observability service for
  # streaming container logs in a browser. It is disabled by default; an
  # operator uncomments this block to enable it. Access is localhost-only
  # (127.0.0.1:8081) and reached over an SSH tunnel, never published openly.
  #
  # SECURITY: mounting /var/run/docker.sock gives the container read access
  # equivalent to host root over Docker state. The localhost bind + SSH-tunnel
  # access pattern is the mitigation; do not expose 8081 to a public interface.
  #
  # dozzle:
  #   image: amir20/dozzle@sha256:replace-with-pinned-digest
  #   platform: linux/amd64
  #   pull_policy: always
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   ports:
  #     - "127.0.0.1:8081:8080"
  #   networks: [ingress]
  #   profiles: [observability]

networks:
  backend:
    internal: true
  ingress:

volumes:
  postgres-data:
  document-data:
