    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

         is intentionally generic — never a client name. -->

         placeholders (real branding is Tenant Configuration at deploy time). -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Enterprise Management System" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EMS" />
  </head>
