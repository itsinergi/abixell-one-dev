<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title is set at runtime from Tenant Branding Configuration once the
         Configuration Engine (Checkpoint 0C) exists. This static fallback
         is intentionally generic — never a client name. -->
    <title>Enterprise Management System</title>
    <!-- Checkpoint 1C.7 — PWA baseline. Icon/name are client-neutral
         placeholders (real branding is Tenant Configuration at deploy time). -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Enterprise Management System" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EMS" />
    <!-- Design tokens (Epic 4 Wave 1). Applied before first paint so a stored
         theme never flashes the other one while the bundle loads. Kept in
         sync with src/theme/ThemeProvider.tsx: same key, same two values. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("abixell.theme.v1");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (error) {
          /* Storage unavailable: the default theme applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
