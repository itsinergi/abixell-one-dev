<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title is set at runtime from Tenant Branding Configuration once the
         Configuration Engine (Checkpoint 0C) exists. This static fallback
         is intentionally generic — never a client name. -->
    <title>Enterprise Management System</title>
    <!-- Checkpoint 1C.7 — PWA baseline. Icon/name are client-neutral
         placeholders (real branding is Tenant Configuration at deploy time). -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Enterprise Management System" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EMS" />
    <!-- Design tokens (Epic 4 Wave 1) and the UI language. Applied before
         first paint so a stored theme or language never flashes the other one
         while the bundle loads. Kept in sync with src/theme/ThemeProvider.tsx
         and src/i18n/LocaleProvider.tsx: same keys, same values. -->
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("abixell.theme.v1");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
          var locale = window.localStorage.getItem("abixell.locale.v1");
          if (locale === "en" || locale === "id") {
            document.documentElement.setAttribute("lang", locale);
            document.documentElement.setAttribute("data-locale", locale);
          }
        } catch (error) {
          /* Storage unavailable: the default theme and language apply. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
